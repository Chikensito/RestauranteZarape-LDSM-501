<section id="alimentos">
    <div class="catalogo-header">
        <div>
            <h2>Catalogo de Alimentos</h2>
            <p>Estos registros se usan como base para armar combos.</p>
        </div>
        <button type="button" class="btn-principal" id="btnNuevoAlimento">Agregar alimento</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Id alimento</th>
                <th>Id producto</th>
                <th>Nombre</th>
                <th>Descripcion</th>
                <th>Foto</th>
                <th>Precio</th>
                <th>Id categoria</th>
                <th>Activo</th>
                <th>Seleccionar</th>
                <th>Eliminar</th>
            </tr>
        </thead>
        <tbody id="tbAlimentos"></tbody>
    </table>
</section>
