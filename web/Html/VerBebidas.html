<section id="verBebidaForm">
    <div class="campo-formulario">
        <label for="txtIdBebida">Id bebida</label>
        <input type="number" id="txtIdBebida" readonly>
    </div>

    <div class="campo-formulario">
        <label for="txtNombreBebida">Nombre</label>
        <input type="text" id="txtNombreBebida" placeholder="Ejemplo: Cafe de olla">
    </div>

    <div class="campo-formulario campo-completo">
        <label for="txtDescripcionBebida">Descripcion</label>
        <input type="text" id="txtDescripcionBebida" placeholder="Ejemplo: Cafe tradicional con canela">
    </div>

    <div class="campo-formulario">
        <label for="txtRutaFotoBebida">Foto</label>
        <input type="file" id="txtRutaFotoBebida" accept="image/*">
    </div>

    <div class="campo-formulario">
        <label for="txtPrecioBebida">Precio</label>
        <input type="number" id="txtPrecioBebida" step="0.01" min="0" placeholder="0.00">
    </div>

    <div class="campo-formulario">
        <label for="txtCategoriaBebida">Categoria</label>
        <input type="text" id="txtCategoriaBebida" placeholder="Ejemplo: Cafes">
    </div>

    <div class="campo-formulario">
        <label for="txtActivoBebida">Activo</label>
        <select id="txtActivoBebida">
            <option value="1">Si</option>
            <option value="0">No</option>
        </select>
    </div>

    <div class="botones">
        <button type="button" onclick="insertarBebida();">Insertar</button>
        <button type="button" onclick="modificarBebida();">Modificar</button>
        <button type="button" onclick="cancelarBebida();">Cancelar</button>
        <button type="button" onclick="eliminarBebida();">Eliminar</button>
    </div>
</section>
