<section id="verCombos">
    <h3>Detalle del Combo</h3>

    <div class="campo-formulario">
        <label for="txtIdCombo">Id combo</label>
        <input type="number" id="txtIdCombo" readonly>
    </div>

    <div class="campo-formulario">
        <label for="txtNombreCombo">Nombre del combo</label>
        <input type="text" id="txtNombreCombo" placeholder="Ejemplo: Combo Desayuno Norte">
    </div>

    <div class="campo-formulario campo-completo">
        <label for="txtDescripcionCombo">Descripcion</label>
        <textarea id="txtDescripcionCombo" rows="3" placeholder="Describe el paquete de desayuno"></textarea>
    </div>

    <div class="campo-formulario">
        <label for="txtPrecioCombo">Precio del combo</label>
        <input type="number" id="txtPrecioCombo" min="0" step="0.01" placeholder="0.00">
    </div>

    <div class="campo-formulario">
        <label for="txtActivoCombo">Estatus</label>
        <select id="txtActivoCombo">
            <option value="1">Activo</option>
            <option value="0">Baja</option>
        </select>
    </div>

    <div class="campo-completo">
        <div class="acciones-secundarias">
            <button type="button" id="btnCalcularPrecioCombo">Calcular precio sugerido</button>
        </div>
    </div>

    <div class="selector-grid campo-completo">
        <div class="selector-card">
            <h4>Catalogo Alimento</h4>
            <p>Selecciona uno o varios alimentos para el combo.</p>
            <div id="listaAlimentosCombo" class="selector-lista"></div>
        </div>

        <div class="selector-card">
            <h4>Catalogo Bebida</h4>
            <p>Selecciona una o varias bebidas para el combo.</p>
            <div id="listaBebidasCombo" class="selector-lista"></div>
        </div>
    </div>

    <div class="campo-completo">
        <div id="resumenComponentes" class="combo-resumen"></div>
    </div>

    <div class="botones">
        <button type="button" onclick="insertarCombo();">Insertar</button>
        <button type="button" onclick="modificarCombo();">Modificar</button>
        <button type="button" onclick="cancelarCombo();">Cancelar</button>
        <button type="button" onclick="eliminarComboDesdeVista();">Eliminar</button>
    </div>
</section>
