<section id="verSuc">
    <form id="formSucursal">
        <!-- ID oculto -->
        <input type="hidden" id="txtIdSuc">

        <label for="txtNombreSuc">Nombre</label>
        <input type="text" id="txtNombreSuc">

        <label for="txtLatitudSuc">Latitud</label>
        <input type="text" id="txtLatitudSuc">

        <label for="txtLongitudSuc">Longitud</label>
        <input type="text" id="txtLongitudSuc">

        <!-- ✅ CORREGIDO: file input y hidden base64 con IDs distintos -->
        <label for="txtFotoFile">Foto</label>
        <input type="file" id="txtFotoFile" accept="image/*" onchange="procesarImagenSucursal(this)">
        <input type="hidden" id="txtFotoBase64">
        <!-- ✅ CORREGIDO: sin src para evitar 404, oculta por defecto -->
        <img id="imgFotoPreview" style="max-width:150px; margin-top:8px; display:none;">

        <label for="txtUrlSuc">URL web</label>
        <input type="url" id="txtUrlSuc">

        <label for="txtHorariosSuc">Horarios</label>
        <input type="text" id="txtHorariosSuc">

        <label for="txtCalleSuc">Calle</label>
        <input type="text" id="txtCalleSuc">

        <label for="txtNumeroSuc">Numero</label>
        <input type="text" id="txtNumeroSuc">

        <label for="txtColoniaSuc">Colonia</label>
        <input type="text" id="txtColoniaSuc">

        <label for="txtActivoSuc">Activo</label>
        <input type="text" id="txtActivoSuc">

    </form>

    <div class="botones">
        <button type="button" onclick="guardarSucursal()">Guardar</button>
        <button type="button" onclick="guardarSucursal()">Modificar</button>
        <button type="button" onclick="limpiarFormularioSucursal(false)">Cancelar</button>
        <button type="button" onclick="eliminarSucursalActual()">Eliminar</button>
    </div>
</section>
