<section id="bebidas">
    <div class="catalogo-header">
        <div>
            <h2>Catalogo de Bebidas</h2>
            <p>Estos registros tambien alimentan la configuracion del combo.</p>
        </div>
        <button type="button" class="btn-principal" id="btnNuevoBebida">Agregar bebida</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Id bebida</th>
                <th>Id producto</th>
                <th>Nombre</th>
                <th>Descripcion</th>
                <th>Foto</th>
                <th>Precio</th>
                <th>Categoria</th>
                <th>Activo</th>
                <th>Seleccionar</th>
                <th>Eliminar</th>
            </tr>
        </thead>
        <tbody id="tbBebidas"></tbody>
    </table>
</section>
