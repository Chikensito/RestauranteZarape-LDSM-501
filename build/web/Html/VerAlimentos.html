<section id="verAlimentos">
    <div class="campo-formulario">
        <label for="txtIdProducto">Id producto</label>
        <input type="number" id="txtIdProducto" readonly>
    </div>

    <div class="campo-formulario">
        <label for="txtNombreAli">Nombre</label>
        <input type="text" id="txtNombreAli">
    </div>

    <div class="campo-formulario campo-completo">
        <label for="txtDescripcion">Descripcion</label>
        <input type="text" id="txtDescripcion">
    </div>

    <div class="campo-formulario">
        <label for="txtRutaFotoAli">Foto</label>
        <input type="file" id="txtRutaFotoAli">
    </div>

    <div class="campo-formulario">
        <label for="txtPrecio">Precio</label>
        <input type="number" id="txtPrecio" step="0.01" min="0">
    </div>

    <div class="campo-formulario">
        <label for="txtIdCategoria">Id categoria</label>
        <input type="number" id="txtIdCategoria" min="1">
    </div>

    <div class="campo-formulario">
        <label for="txtActivoAli">Activo</label>
        <select id="txtActivoAli">
            <option value="1">Si</option>
            <option value="0">No</option>
        </select>
    </div>

    <div class="botones">
        <button type="button" onclick="insertarAlimento();">Insertar</button>
        <button type="button" onclick="modificarAlimento();">Modificar</button>
        <button type="button" onclick="cancelarAlimento();">Cancelar</button>
        <button type="button" onclick="eliminarAlimento();">Eliminar</button>
    </div>
</section>
